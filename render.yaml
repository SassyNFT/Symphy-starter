services:

  # ---------------------------------------------------
  # BACKEND API (FastAPI or Flask)
  # ---------------------------------------------------
  - type: web
    name: symphy-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt

    # IMPORTANT: You deleted app.py — so fix the start command
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port 10000

    autoDeploy: true
    healthCheckPath: /

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      # DO NOT SYNC — use dashboard for real secrets
      - key: DATABASE_URL
        sync: false

      - key: WHO_CLIENT_ID
        sync: false

      - key: WHO_CLIENT_SECRET
        sync: false

      - key: RUN_AUTO_IMPORT
        value: "false"


  # ---------------------------------------------------
  # BACKGROUND WORKER (ICD-11 Import)
  # ---------------------------------------------------
  - type: worker
    name: symphy-worker
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt

    # Worker runs main.py (your import logic)
    startCommand: python main.py

    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: KEEP_RUNNING
        value: "true"

      - key: DATABASE_URL
        sync: false

      - key: WHO_CLIENT_ID
        sync: false

      - key: WHO_CLIENT_SECRET
        sync: false


  # ---------------------------------------------------
  # FRONTEND (Vite + Static Hosting)
  # ---------------------------------------------------
  - type: web
    name: symphy-web
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "20"

      - key: VITE_API_BASE
        fromService:
          type: web
          name: symphy-api
          property: host
