services:
  # -------- Flask API Backend --------
  - type: web
    name: symphy-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    - key: WHO_CLIENT_ID
      value: 806c1686-e9a8-4f53-9336-869cb19787dd_1f81789d-d38a-474f-b83c-51fe8a8d6aea
    - key: WHO_CLIENT_SECRET
      value: 7VNOd76In0PzX0WW1pU5LBcnQWC0tgxHK8m7rtvxUww=
    - key: RUN_AUTO_IMPORT
      value: "true"
      
  # -------- Frontend (Static Site via Vite/Node) --------
  - type: web
    name: symphy-web
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE
        fromService:
          type: web
          name: symphy-api
          property: host
