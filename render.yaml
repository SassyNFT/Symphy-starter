services:
  # -------- API (FastAPI Docker Web Service) --------
  - type: web
    name: symphy-api
    env: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # -------- Frontend (Static Site via Blueprint) --------
  - type: web
    name: symphy-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE
        fromService:
          type: web
          name: symphy-api
          property: host
